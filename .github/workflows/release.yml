name: Build and Release AutoBackup Tool

on:
  push:
    tags:
      - 'v*'

# Concede permissões explícitas para criar Releases
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Configurar o .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compilar e Publicar (Single-File Portable)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false

    - name: Criar Release e Anexar Executável
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net8.0-windows/win-x64/publish/AutoBackupTool.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
